name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Generate code (freezed, go_router, json)
        run: dart run build_runner build

      - name: Check generated code is committed
        run: git diff --exit-code || { echo "Run 'dart run build_runner build' and commit generated files"; exit 1; }

      - name: Run tests
        run: flutter test

  build-android:
    name: Build Android (QA + Production)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Build QA APK
        run: flutter build apk --flavor qa --debug
      - name: Build Production AAB (release)
        env:
          KEYSTORE_FILE: ${{ secrets.KEYSTORE_FILE }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: flutter build appbundle --flavor production --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: build/app/outputs/**

  build-ios:
    name: Build iOS (Production)
    runs-on: macos-14
    timeout-minutes: 90
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart run build_runner build
      - name: Build iOS (no codesign, archive only)
        continue-on-error: true
        run: flutter build ios --release --no-codesign
      - uses: actions/upload-artifact@v4
        with:
          name: ios-release
          path: build/ios/ipa/**
